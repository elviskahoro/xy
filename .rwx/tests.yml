# Rust + lint/typecheck + pytest. Layer C lives in ci/main.py (Dagger) and runs
# identically on a laptop: ci/run.sh rust|lint|test|all. The GitHub Actions
# workflow stays authoritative until this is green (see ci/README.md).
on:
  github:
    pull_request:
      if: ${{ event.github.pull_request.pull_request.base.ref == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        cache-write: "false"
      status-checks:
        name: rwx-tests
    push:
      - if: ${{ event.git.branch == 'main' }}
        init:
          commit-sha: ${{ event.git.sha }}
          cache-write: "true"
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      cache-write: "false"
  # Refreshes the tool-cache before its 48h TTL lapses.
  cache-rebuild:
    target: [checks]
    init:
      commit-sha: ${{ event.git.sha }}
      cache-write: "true"

# Only main-unlocked runs write the tool cache; PRs restore it read-only.
tool-cache:
  vault: xy-main

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      repository: https://github.com/elviskahoro/xy.git
      ref: ${{ init.commit-sha }}

  - key: uv-install
    run: |
      set -euo pipefail
      script="$(mktemp)"
      trap 'rm -f "${script}"' EXIT
      curl -LsSf https://astral.sh/uv/0.13.5/install.sh -o "${script}"
      echo "1c6e7f025499664633ac2dce43a210800510e9ef0625c52e034a8afdf8bf177a  ${script}" | sha256sum -c -
      sh "${script}"
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  # CLI, engine image and SDK venv never read the checkout, so they stay
  # content-cache hits across commits. Keep the CLI and dagger-io
  # (ci/pyproject.toml) on the same release.
  - key: dagger-cli-install
    run: |
      set -euo pipefail
      v=0.21.8
      d="$(mktemp -d)"
      curl -fsSL "https://dl.dagger.io/dagger/releases/${v}/dagger_v${v}_linux_amd64.tar.gz" -o "${d}/dagger.tgz"
      echo "53e226c7da8fb75171e58c35759d736d961ce8b3a12db0baa7b7107954fccc5a  ${d}/dagger.tgz" | sha256sum -c -
      tar -xzf "${d}/dagger.tgz" -C "${d}" dagger
      mkdir -p "$HOME/.local/bin"
      install -m 755 "${d}/dagger" "$HOME/.local/bin/dagger"
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"
      "$HOME/.local/bin/dagger" version

  - key: dagger-engine-warm
    use: dagger-cli-install
    docker: preserve-data
    run: |
      set -euo pipefail
      for i in 1 2 3; do
        docker pull registry.dagger.io/engine:v0.21.8 && exit 0
        sleep 5
      done
      exit 1

  - key: dagger-sdk-install
    use: [uv-install, code]
    filter:
      - ci/pyproject.toml
      - ci/uv.lock
    run: uv sync --project ci --frozen

  - key: cache-dir
    run: |
      mkdir -p "$HOME/ci-cache"
      echo "$HOME/ci-cache" >> "$RWX_ENV/CI_CACHE_DIR"

  - key: checks
    use: [code, uv-install, cache-dir, dagger-cli-install, dagger-engine-warm, dagger-sdk-install]
    docker: true
    timeout: 60m
    cache: false
    tool-cache: xy-checks
    env:
      CI_CACHE_WRITE: ${{ init.cache-write }}
    run: |
      set -euo pipefail
      chown -R "$(id -u):$(id -g)" "$CI_CACHE_DIR"
      ci/run.sh all
